<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroBov Analytics - Capture</title>
  <style>
    html,
    body {
      background: #f6f8fb;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    iframe {
      border: 0;
      height: 5200px;
      left: 0;
      position: absolute;
      top: 0;
      transform: translateY(calc(var(--offset, 0) * -1px));
      width: 1600px;
    }
  </style>
</head>
<body>
  <iframe id="frame" src="index.html?fresh=capture-local"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    document.documentElement.style.setProperty("--offset", params.get("offset") || "0");
  </script>
</body>
</html>
